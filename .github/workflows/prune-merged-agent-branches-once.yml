name: One-time prune of four merged legacy branches

on:
  push:
    branches:
      - agent/official-tasks-adapter-20261008
    paths:
      - .github/workflows/prune-merged-agent-branches-once.yml

permissions:
  contents: write

jobs:
  prune-merged-branches:
    if: github.repository == 'joeyijun/OpticStudioMCPServer' && github.ref == 'refs/heads/agent/official-tasks-adapter-20261008'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch heads and safe ancestry before deletion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse refs/remotes/origin/main)" = "9e2c47c0075d5b97036b149596b08daba43475ca"
          git rev-parse refs/remotes/origin/agent/official-tasks-adapter-20261008 >/dev/null
          while read -r branch expected; do
            actual="$(git rev-parse "refs/remotes/origin/$branch")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Unexpected head on $branch; abort cleanup"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$actual" refs/remotes/origin/main ||
               ! git merge-base --is-ancestor "$actual" refs/remotes/origin/agent/official-tasks-adapter-20261008; then
              echo "::error::Unmerged work on $branch; abort cleanup"
              exit 1
            fi
            echo "Safe to delete fully merged branch $branch"
          done <<'BRANCHES'
          agent/fluent-materials-v1.4.2 94435c210351151ca390ef11e1bf45a833e0fb73
          agent/release-1.5.0-acceptance 15203003a85f94c566da6989006e3ba86f75037e
          agent/release-runtime-hardening-20260930 557b12435e86f82094ea3e7643be0a343508a924
          agent/tasks-job-ledger-foundation-20261008 c54313e2ba9021bdab1114e322656286a6188bad
          BRANCHES
      - name: Delete only verified merged branches through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            agent/fluent-materials-v1.4.2 \
            agent/release-1.5.0-acceptance \
            agent/release-runtime-hardening-20260930 \
            agent/tasks-job-ledger-foundation-20261008; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted merged branch: $branch"
          done
