name: Verify Windows desktop components

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Verify MCP tool registration
        shell: pwsh
        run: ./scripts/verify-tool-registration.ps1
      - name: Verify explicit operation safety metadata
        shell: pwsh
        run: ./scripts/verify-operation-metadata.ps1
      - name: Verify Stage A-F functional safety
        shell: pwsh
        run: ./scripts/verify-functional-safety.ps1
      - name: Verify Stage E optimization contracts
        shell: pwsh
        run: ./scripts/verify-optimization-contracts.ps1
      - name: Verify Stage F specialized contracts
        shell: pwsh
        run: ./scripts/verify-specialized-contracts.ps1
      - name: Build and simulate ZOS-independent Core/Server logic
        shell: pwsh
        run: dotnet run --project tests/ZemaxMCP.SimulationTests/ZemaxMCP.SimulationTests.csproj -c Release
      - name: Build public desktop components
        shell: pwsh
        run: |
          dotnet build src/ZemaxMCP.HttpBridge/ZemaxMCP.HttpBridge.csproj -c Release
          dotnet build src/ZemaxMCP.ClientProxy/ZemaxMCP.ClientProxy.csproj -c Release
          dotnet build src/ZemaxMCP.Launcher/ZemaxMCP.Launcher.csproj -c Release
          dotnet build src/ZemaxMCP.Installer/ZemaxMCP.Installer.csproj -c Release
          dotnet build src/ZemaxMCP.Updater/ZemaxMCP.Updater.csproj -c Release
      - name: Verify discovery, configuration paths, and icons
        shell: pwsh
        run: ./scripts/verify-desktop-components.ps1 -Configuration Release
      - name: Verify official MCP Host and private RPC boundary
        shell: pwsh
        run: ./scripts/verify-modern-host.ps1 -Configuration Release
      - name: Verify updater apply and rollback behavior
        shell: pwsh
        run: ./scripts/verify-updater.ps1 -Configuration Release
      - name: Verify signed update fixture and tamper rejection
        shell: pwsh
        run: ./scripts/verify-update-manifest.ps1 -Configuration Release -ManifestPath scripts/fixtures/signed-update-fixture.json -PackagePath scripts/fixtures/signed-update-fixture.bin -Version v1.1-fixture
